# Summary overlay display configuration for each simulation family.
#
# - ids can refer to built-in app metrics such as `runtime`
# - ids can also refer to keys under the selected run's `run_summary.yaml`
#   `summaryMetrics` map
# - `display_format` can be `integer`, `float`, or `scientific`
# - `precision` controls decimal places or scientific significant figures

planetary:
  summaryStats:
    - id: runtime
      value: '0.00'
      unit: hours
    - id: similarityScore
      value: 100/100
    - id: moon_mass
      label: Moon mass
      value: '1.05'
    - id: earth_mass
      label: Earth mass
      value: '1.55'
    - id: spin
      label: Spin of Earth-Moon system
      value: '0.30'
    - id: moon_iron
      label: Moon iron
      value: '0.70'
    - id: proto_earth_in_moon
      label: Proto-Earth in Moon
      value: '1.25'
    - id: carbonBurnt
      value: '0.00'
      unit: kgCO2e
    - id: computeUsed
      value: '0.0'
      unit: smartphones
    - id: memoryUsed
      value: '0.0'
      unit: GB
    - id: particlesUpdated
      value: '0'
      label: Particle updates

galaxy:
  summaryStats:
    - id: runtime
      value: '0.00'
      unit: hours
    - id: similarityScore
      value: 100/100
    - id: carbonBurnt
      value: '0.00'
      unit: kgCO2e
    - id: computeUsed
      value: '0.0'
      unit: smartphones
    - id: memoryUsed
      value: '0.0'
      unit: GB
    - id: particlesUpdated
      value: '0'
      label: Particle updates

cosmos:
  summaryStats:
    - id: runtime
      value: '0.00'
      unit: hours
    - id: similarityScore
      value: 100/100
    - id: carbonBurnt
      value: '0.00'
      unit: kgCO2e
      display_format: float
      precision: 2
    - id: computeUsed
      value: '0.0'
      unit: smartphones
      display_format: float
      precision: 1
    - id: memoryUsed
      value: '0.0'
      unit: GB
      display_format: float
      precision: 1
    - id: particlesUpdated
      value: '0'
      label: Particle updates
      display_format: integer
