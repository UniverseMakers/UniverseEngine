# Simulation family catalog source-of-truth.
#
# Each top-level key is one simulation family shown in the UI.
# Parameter definitions live in `parameter-info.yaml`.
# Display stat configuration lives in `stats-config.yaml`.
#
# `metadata.correctValues`
#   Canonical target values for summary comparisons.
#   - when an id matches a simulation parameter, parameter-based similarity can use it
#   - when an id matches a run `parameters.yaml` entry or `run_summary.yaml`
#     summary metric, the summary overlay can render answer-closeness bars for it
#
# `views`
#   Optional display-mode video tabs.
#   - `id` must match a view key in the generated run manifest
#   - `label` renders text in the switcher
#   - `icon` can be used instead of text when a theme wants glyph-first tabs

planetary:
  label: Planetary
  placeholderImage: assets/planet_example.webp
  metadata:
    distinctSimulations: 384
    correctValues:
      moon_mass: 1.0
      earth_mass: 1.0
      spin: 1.0
      moon_iron: 1.0
      proto_earth_in_moon: 1.0

galaxy:
  label: Galaxy
  placeholderImage: assets/galaxy_example.webp
  views:
    - id: hst
      label: Hubble Space Telescope
      icon: hubble-space-telescope
      description: See your galaxy as the Hubble Space Telescope would — a luminous swirl of billions of stars. Brighter regions trace where the most stars were born.
    - id: sph_plus_hst
      label: Large Scale Structure
      icon: large-scale-structure
      description: Zoom out to see the grand architecture of your galaxy — vast streams of gas, sprawling spiral arms, and the hidden skeleton of dark matter that holds everything together.
  metadata:
    distinctSimulations: 20488
    correctValues:
      stellar_mass: 6.1 # in units of 1e10 Msun
      black_hole_mass: 4.3 # in units of 1e6 Msun
      galaxy_age: 8.5 # in Gyr; approximate Milky Way mass-weighted stellar age

cosmos:
  label: Cosmos
  placeholderImage: assets/cosmos_example.webp
  views:
    - id: gas_density
      label: Gas Density
      icon: gas-density
      description: A map of the cosmic web — the largest structures in the Universe. Bright knots are galaxy clusters; wispy threads are filaments of gas stretching between them; dark empty patches are vast cosmic voids.
    - id: gas_temperature
      label: Gas Temperature
      icon: gas-temperature
      description: Colours reveal temperature — from searing-hot gas around galaxy clusters (millions of degrees) down to the cool, gentle filaments where new galaxies may one day form.
    - id: dark_matter_density
      label: Dark Matter
      icon: dark-matter
      description: The invisible scaffolding of the cosmos. Dark matter outweighs ordinary matter five to one — you can't see it, but without it, galaxies like ours would never have formed.
    - id: gas_metallicity_plus_stellar_density
      label: Metals + Stars
      icon: metals-stars
      description: Where stars live and die. This view combines the light of stars with the heavy elements they forge — oxygen, carbon, iron — sprayed back into space by supernova explosions to seed the next generation.
  metadata:
    distinctSimulations: 8192
    correctValues:
      baryon_fraction: 1.0
      black_hole_strength: 1.0
      gravity_strength: 1.0
