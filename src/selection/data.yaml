# Simulation catalog source-of-truth.
#
# Each top-level key is one simulation family shown in the UI.
#
# `metadata.summaryStats`
#   End-of-run summary cards.
#   - ids can refer to built-in app metrics such as `runtime`
#   - ids can also refer to keys under the selected run's `run_summary.yaml`
#     `summaryMetrics` map
#   - `display_format` can be `integer`, `float`, `scientific`, or `percentage`
#   - `precision` controls decimal places or scientific significant figures
#
# `metadata.liveStats`
#   Top-right live telemetry rows.
#   - `value` is the initial/fallback display value
#   - `unit` is appended by the app
#   - `live: true` means a CSV stream should provide updates
#   - `live_key` can override which CSV column should be used
#   - `from_video: true` means the final value should be pulled from the active
#     video's sidecar metadata YAML
#   - `video_key` can override which metadata key should be used
#   - `scale_with_time: true` (when `live`) scales the final metadata value
#     linearly by normalized playback time
#   - `value_scale` multiplies a live numeric value before formatting
#
# `parameters`
#   Config-overlay controls and parameter-space metadata.
#
# `views`
#   Optional display-mode video tabs.
#   - `id` must match a view key in the generated run manifest
#   - `label` renders text in the switcher
#   - `icon` can be used instead of text when a theme wants glyph-first tabs

planetary:
  label: Planetary
  icon: '🌍'
  placeholderImage: assets/planet_example.webp
  metadata:
    distinctSimulations: 384
    correctValues:
      impactor_mass: 0.12
      impactor_velocity: 14
      impactor_angle: 43
    summaryStats:
      - id: runtime
        value: '0.00'
        unit: hours
        from_video: true
        video_key: wallclockSeconds
      - id: similarityScore
        value: 100/100
      - id: carbonBurnt
        value: '0.00'
        unit: kgCO2e
        from_video: true
      - id: computeUsed
        value: '0.0'
        unit: smartphones
        from_video: true
      - id: memoryUsed
        value: '0.0'
        unit: GB
        from_video: true
      - id: particlesUpdated
        value: '0'
        label: Particle updates
        from_video: true
    liveStats:
      - id: impactor_mass
        value: '0.10'
        unit: M⊕
        live: false
      - id: impactor_velocity
        value: '12.0'
        unit: km/s
        live: false
      - id: impactor_angle
        value: '45'
        unit: °
        live: false
      - id: time
        value: 0.0
        unit: hours
        live: true
      - id: temperature
        value: 0.0
        unit: K
        live: true
      - id: Earth mass
        value: 1.0
        unit: M⊕
        live: true
      - id: particlesUpdated
        value: '0'
        label: Particle updates
        live: true
        from_video: true
        scale_with_time: true
        integer: true
  parameters:
    impactor_mass:
      label: Impactor Mass
      unit: M⊕
      min: 0.01
      max: 10
      step: 0.01
      default: 0.1
    impactor_velocity:
      label: Impactor Velocity
      unit: km/s
      min: 1
      max: 50
      step: 0.5
      default: 12
    impactor_angle:
      label: Impactor Angle
      unit: °
      min: 0
      max: 90
      step: 1
      default: 45

